<style>
    body {
        font-family: Inter, sans-serif;
        margin: 0;
        padding: 14px;
        color: #e6e6e6;
        background: #2c2c2c;
    }
    button {
        width: 100%;
        height: 34px;
        border: none;
        border-radius: 6px;
        background: #5b8def;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
    }
    button:hover {
        background: #6f9bf2;
    }
    #status {
        margin: 10px 0 0;
        font-size: 12px;
        min-height: 16px;
    }
    .hint {
        margin: 0 0 12px;
        font-size: 11px;
        color: #999;
        line-height: 1.4;
    }
</style>

<p class="hint">Select a frame in Figma, make sure the Lunar IDE app is open, then send.</p>
<button id="send">Send selected frame to Lunar</button>
<p id="status"></p>

<script>
    document.getElementById("send").onclick = () => {
        document.getElementById("status").textContent = "Sending…";
        parent.postMessage({ pluginMessage: { type: "send" } }, "*");
    };
    onmessage = (e) => {
        const m = e.data.pluginMessage;
        if (!m || m.type !== "status") return;
        const s = document.getElementById("status");
        s.textContent = m.text;
        s.style.color = m.ok ? "#3fb950" : "#f85149";
    };
</script>
